name: Voices

# Makes natural-sounding recordings of the built-in travel prayers (neural voices) and commits
# them into the app's assets. Run it again after changing tools/prayers.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: python tools/make_voices.py
      - name: Commit recordings
        run: |
          git config user.name "voices-bot"
          git config user.email "voices-bot@users.noreply.github.com"
          git add app/src/main/assets/voice
          git diff --cached --quiet || git commit -m "Prayer recordings"
          git push
