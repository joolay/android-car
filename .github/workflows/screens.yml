name: Screenshots

# Renders the launcher's real views to PNG (800x480 at 2x) with Robolectric and pushes them to the
# "screens" branch, so screenshots match the code exactly.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Render
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest --tests '*ScreensTest*' --no-daemon --stacktrace 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "error:|Exception|at com.carbox|Caused by|What went wrong|FAILED" test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            for f in app/build/test-results/testDebugUnitTest/*.xml; do grep -A25 "<failure" "$f" | head -40 | while IFS= read -r l; do echo "::error::$l"; done; done
            exit $status
          fi
          ls -la screens
      - name: Publish to the screens branch
        run: |
          cd screens
          git init -q -b screens
          git config user.name "screens-bot"
          git config user.email "screens-bot@users.noreply.github.com"
          git add .
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screens
