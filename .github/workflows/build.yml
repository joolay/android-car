name: Build Car Launcher APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned: ubuntu-24.04 ships with the Android SDK preinstalled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Works both ways: the full project in the repo, or just CarLauncher.zip uploaded from a phone
      - name: Find project
        run: |
          if [ -f CarLauncher.zip ] && [ ! -f settings.gradle ]; then
            mkdir -p src && unzip -q -o CarLauncher.zip -d src
            echo "DIR=src" >> "$GITHUB_ENV"
          else
            echo "DIR=." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK/platforms" ]; then
            echo "No preinstalled SDK found - installing command-line tools"
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > "$DIR/local.properties"

      # Next build number: v<major>.<n>-alpha, one more than the last published build of this major
      # version (failed builds publish nothing, so numbers never skip). version-major.txt holds the major.
      - name: Work out version
        run: |
          git fetch --tags --force -q || true
          MAJOR=$(cat "$DIR/version-major.txt" 2>/dev/null || echo 0)
          LAST=$(git tag -l "v$MAJOR.*-alpha" | sed -E "s/^v$MAJOR\.([0-9]+)-alpha$/\1/" | grep -E '^[0-9]+$' | sort -n | tail -1)
          NEXT=$(( ${LAST:--1} + 1 ))
          echo "VER=$MAJOR.$NEXT" >> "$GITHUB_ENV"
          echo "Building $MAJOR.$NEXT alpha"

      - name: Build APK
        run: |
          cd "$DIR"
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "error:|warning: \[|e: |What went wrong|AAPT|> " build.log | grep -v "^> Task" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit $status
          fi
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CarLauncher.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: CarLauncher-apk
          path: CarLauncher.apk

      # Publish as its own pre-release, e.g. v0.3-alpha
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-alpha
          name: Car Launcher ${{ env.VER }} alpha
          prerelease: true
          overwrite_files: true
          files: CarLauncher.apk
