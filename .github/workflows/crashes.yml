name: Collect crash reports

# Car Launcher sends crash reports and troubleshooting logs to a private ntfy.sh topic (messages kept
# there ~12 h, attached logs ~3 h). This copies them into the "crashes" branch so they can be read any
# time: crashes.jsonl (one report per line) and logs/ (the troubleshooting log zips).
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crashes

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the crashes branch (or start it)
        run: |
          git init -q work && cd work
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin crashes; then git checkout -q -b crashes FETCH_HEAD; else git checkout -q --orphan crashes; fi
          touch crashes.jsonl
      - name: Fetch new reports
        run: |
          cd work
          code=$(curl -sS -w "%{http_code}" "https://ntfy.sh/carlauncher-crash-4d6dd33614e4914e/json?poll=1&since=all" -o new.jsonl || echo fail)
          touch new.jsonl
          echo "::warning::ntfy answered $code with $(grep -c '"event":"message"' new.jsonl) messages; first bytes: $(head -c 200 new.jsonl | tr -d '\n')"
          # keep only messages, skip ones already saved (by id)
          jq -c 'select(.event=="message") | {id, time, title, message, file: (.attachment.name // null), url: (.attachment.url // null)}' new.jsonl > msgs.jsonl || true
          echo "::warning::kept $(wc -l < msgs.jsonl) messages; jq says: $(jq -c . new.jsonl 2>&1 >/dev/null | head -c 300)" 
          mkdir -p logs
          while IFS= read -r line; do
            id=$(echo "$line" | jq -r .id)
            if ! grep -q "\"id\":\"$id\"" crashes.jsonl; then
              echo "$line" >> crashes.jsonl
              url=$(echo "$line" | jq -r '.url // empty'); file=$(echo "$line" | jq -r '.file // empty')
              [ -n "$url" ] && curl -fsSL "$url" -o "logs/${id}-${file:-log.zip}" || true
            fi
          done < msgs.jsonl
          rm -f new.jsonl msgs.jsonl
      - name: Save
        run: |
          cd work
          git config user.name "crash-collector"
          git config user.email "actions@users.noreply.github.com"
          git add crashes.jsonl logs
          git diff --cached --quiet || { git commit -qm "Crash reports $(date -u +%F\ %H:%M)"; git push -q origin crashes; }
