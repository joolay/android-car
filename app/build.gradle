plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carbox.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.carbox.launcher'
        minSdk 26
        targetSdk 33
        // always newer than the last build (GitHub's run number), so Android installs it as an update
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '4') + 4
        versionName '0.2'
    }

    // one fixed signing key for every build. Without it each GitHub build signs with a brand-new
    // random debug key, and Android refuses to update an app signed with a different key.
    signingConfigs {
        fixed {
            storeFile file('carlauncher.keystore')
            storePassword 'carlauncher'
            keyAlias 'carlauncher'
            keyPassword 'carlauncher'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'screens.dir', "${rootDir}/screens"
                maxHeapSize = '2g'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // only for the Screenshots workflow (renders the real views to PNG); not in the APK
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
